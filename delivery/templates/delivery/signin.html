{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealBite | Sign In</title>

    <link rel="stylesheet" href="{% static 'delivery/signin.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="left">
        <h1>🍴 Meal<span>Bite</span></h1>

        <h2>Welcome Back!</h2>

        <p>
            Sign in to order your favorite meals and track your deliveries.
        </p>

        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800" alt="Pizza">
    </div>

    <div class="right">

        <form action="{% url 'signin' %}" method="POST">
            {% csrf_token %}

            <h2>Sign In</h2>
    

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Sign In</button>

            <p class="signup-link">
                Don't have an account?
                <a href="{% url 'open_signup' %}">Sign Up</a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
