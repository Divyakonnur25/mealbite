<!DOCTYPE html>
<html>
<head>
    <title>Delete Restaurant</title>
</head>
<body>

    <h2>Delete Restaurant</h2>

    <p>Are you sure you want to delete <strong>{{ restaurant.restaurant_name }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'open_show_restaurants' %}">
        Cancel
    </a>

</body>
</html>
