{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Update Menu</title>
    <link rel="stylesheet" href="{% static 'delivery/add_menu.css' %}">
</head>

<body>

<div class="container">

    <h1>Update Menu Item</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Item Name</label>
        <input type="text" name="item_name" value="{{ menu.item_name }}">

        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ menu.price }}">

        <label>Category</label>
        <input type="text" name="category" value="{{ menu.category }}">

        <label>Description</label>
        <textarea name="description">{{ menu.description }}</textarea>

        <label>Image URL</label>
        <input type="text" name="image" value="{{ menu.image }}">

        <button type="submit" class="submit-btn">
            Update Menu
        </button>

    </form>

</div>

</body>
</html>
